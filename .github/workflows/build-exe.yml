name: Test and build Windows EXE

# على خادم ويندوز من GitHub: يشغّل اختبارات المحرك، ثم يفتح الواجهة دون شاشة ويمر بمزامنة كاملة،
# ثم يبني SyncFile.exe وينشره كإصدار باسم __version__ في syncfile/__init__.py.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Engine tests
        run: python -m unittest discover -s tests -v

      - name: Interface smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --smoke

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import syncfile; print(syncfile.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name SyncFile main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncFile-${{ steps.ver.outputs.version }}
          path: dist/SyncFile.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SyncFile v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/SyncFile.exe
          body_path: RELEASE_NOTES.md
          make_latest: true
